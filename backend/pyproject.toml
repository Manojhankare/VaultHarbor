[project]
name = "vaultharbor-backend"
version = "0.1.0"
description = "Zero-knowledge password manager backend API"
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "Manoj Hankare", email = "manojhankare2@gmail.com" }]
license = "MIT"
dependencies = [
    "flask>=3.1.0,<4",
    "flask-sqlalchemy>=3.1.0,<4",
    "flask-migrate>=4.0.0,<5",
    "sqlalchemy>=2.0.0,<3",
    "alembic>=1.14.0,<2",
    "pydantic>=2.0.0,<3",
    "pydantic-settings>=2.0.0,<3",
    "pyjwt>=2.8.0,<3",
    "argon2-cffi>=23.0.0,<26",
    "flask-cors>=4.0.0,<7",
    "flask-limiter>=3.8.0,<5",
    "psycopg[binary]>=3.1.0,<4",
    "gunicorn>=22.0.0,<27",
    "python-dotenv>=1.0.0,<2",
    "email-validator>=2.0.0,<3",
    "apispec>=6.0.0,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.vercel]
entrypoint = "wsgi:app"

[tool.ruff]
line-length = 100
target-version = "py312"
