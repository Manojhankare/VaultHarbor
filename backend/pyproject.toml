[project]
name = "vaultsync-backend"
version = "0.1.0"
description = "Zero-knowledge password manager backend API"
requires-python = ">=3.12"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.vercel]
entrypoint = "wsgi:app"

[tool.ruff]
line-length = 100
target-version = "py312"
